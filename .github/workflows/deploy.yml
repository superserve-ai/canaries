name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_staging: ${{ steps.staging.outputs.image }}
      image_prod: ${{ steps.prod.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev us-west2-docker.pkg.dev --quiet

      - name: Build staging image
        id: staging
        run: |
          set -euo pipefail
          IMAGE="us-central1-docker.pkg.dev/rayai-dev/superserve/api-canary:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build production image
        id: prod
        run: |
          set -euo pipefail
          IMAGE="us-central1-docker.pkg.dev/rayai-prod/superserve/api-canary:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Apply staging
        run: |
          set -euo pipefail
          cd infra/envs/staging/us-central1
          terraform init -input=false
          terraform apply -input=false -auto-approve -var="image=${{ needs.build.outputs.image_staging }}"

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Apply production
        run: |
          set -euo pipefail
          cd infra/envs/production
          terraform init -input=false
          terraform apply -input=false -auto-approve -var="image=${{ needs.build.outputs.image_prod }}"
