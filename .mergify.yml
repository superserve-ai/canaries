merge_queue:
  max_parallel_checks: 3
  mode: serial
  queue_controls_comment: true
queue_rules:
  - name: main
    queue_conditions:
      - base = main
      - "#approved-reviews-by >= 1"
      - check-success = @github-actions/test
      - check-success = @github-actions/terraform-plan (staging, staging, infra/envs/staging/us-central1)
      - check-success = @github-actions/terraform-plan (production, production, infra/envs/production)
      - check-success = @github-actions/terraform-plan (production east, production, infra/envs/production/us-east4)
    batch_size: 1
    merge_method: squash
